name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cpu:
    name: Build (Windows CPU)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (for libclang)
        run: choco install llvm -y --no-progress

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: cargo build --release
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/anuvaad.exe out/anuvaad-cpu.exe
          Copy-Item scripts out/scripts -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: anuvaad-cpu
          path: out/

  build-cuda:
    name: Build (Windows CUDA)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (for libclang)
        run: choco install llvm -y --no-progress

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.18
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","curand","curand_dev","cufft","cufft_dev","thrust"]'

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: cuda

      - name: Build with CUDA
        shell: pwsh
        run: cargo build --release --features cuda
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/anuvaad.exe out/anuvaad-cuda.exe
          Copy-Item scripts out/scripts -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: anuvaad-cuda
          path: out/

  release:
    name: Publish release
    needs: [build-cpu, build-cuda]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Repackage
        run: |
          mkdir -p dist
          # anuvaad-cpu.zip
          cd artifacts/anuvaad-cpu && zip -r ../../dist/anuvaad-cpu-${GITHUB_REF_NAME}.zip . && cd ../..
          # anuvaad-cuda.zip
          cd artifacts/anuvaad-cuda && zip -r ../../dist/anuvaad-cuda-${GITHUB_REF_NAME}.zip . && cd ../..
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
